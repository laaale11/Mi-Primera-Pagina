<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #555;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 40px;
        }

        .tarjeta {
            background-color: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Mi Primera Página Web</h1>
        <p>Bienvenidos a mi sitio web</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">Productos</a>
        <a href="#">Contacto</a>
    </nav>

    <main>

        <div class="tarjeta">
            <h2>Sobre nosotros</h2>
            <p>
                Esta es una página web creada como práctica
                para aprender HTML y Git.
            </p>
        </div>

        <div class="tarjeta">
            <h2>Nuestros productos</h2>
            <p>Conoce nuestros productos y servicios.</p>
            <button>Ver productos</button>
        </div>

    </main>

    <footer>
        <p>© 2026 Mi Primera Página Web</p>
    </footer>

</body>
</html>
